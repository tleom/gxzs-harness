- id: office-to-pdf
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false

# Web access is provided by the selected platform MCP tools.
- id: tool-web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- id: web-fetch-http
  disabled: true

- id: agent-preset-registry
  config:
    default: standard

# Derived search data belongs to the same owner home as the original sessions.
# Retain completed indexing across Host recreation; DSH validates revisions.
- id: optional-session-query-sqlite
  config:
    path: !!js (process.env.DSH_HOME ?? process.cwd()) + '/session-search.sqlite'
    openAt: first-search

# Native reconciliation can take over 30 seconds when building a cold index.
# Keep the official search scope and reconciliation algorithm unchanged.
- id: optional-tool-session-query
  config:
    searchTimeoutMs: 120000

# The official bundle keeps a separate owner-scoped PTY registry. Include its
# live resources in the Host idle check without merging it with sidebar PTYs.
- id: optional-persistent-terminals
  insert:
    - id: gxzs-persistent-terminal-activity
      name: '@gxzs/dsh-workbench-adapter/persistent-terminal-activity'

- id: sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: subprocess
  disabled: true

- id: spill-local
  disabled: true

- id: workspace-changes
  disabled: true

- id: file-reference-local
  disabled: true

# Start native reminder delivery after the Workbench admission fence is installed.
- id: schedule
  disabled: true

- id: ptc-runtime
  config:
    launch:
      kind: node-script
      executable: !!js process.env.GXZS_SANDBOX_NODE ?? '/usr/local/bin/node'
      bootstrapPath: !!js process.env.GXZS_SANDBOX_PTC_BOOTSTRAP ?? '/opt/dsh/node_modules/@deepseek-ai/dsh-ptc-runtime-node/lib/process.js'

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'
    workspaceRoot: !!js process.env.GXZS_SANDBOX_WORKSPACE ?? '/workspace'

- insert:
    - id: gxzs-file-references
      name: '@gxzs/dsh-workbench-sandbox-runtime/file-references'
    - id: gxzs-ssh
      name: '@gxzs/dsh-workbench-sandbox-runtime/ssh'
      config:
        host: !!js process.env.GXZS_SANDBOX_SSH_HOST
        launch:
          kind: node-script
          node: !!js process.env.GXZS_SANDBOX_NODE ?? '/usr/local/bin/node'
        helper: !!js process.env.GXZS_SANDBOX_HELPER ?? '/opt/dsh/node_modules/@deepseek-ai/dsh-ssh/lib/helper.js'
        helperHash: !!js process.env.GXZS_SANDBOX_HELPER_HASH
        workspace: !!js process.env.GXZS_SANDBOX_WORKSPACE ?? '/workspace'
        requestTimeoutMs: 30000
        maxFrameBytes: 67108864
        maxPending: 128
        leaseMs: 30000
    - id: gxzs-fs-ssh
      name: '@gxzs/dsh-workbench-sandbox-runtime/fs'
      config:
        attachmentHostRoot: !!js "process.env.GXZS_NATIVE_FILE_ATTACHMENTS === '1' ? process.getBuiltinModule('node:path').join(process.env.DSH_HOME ?? '/srv/dsh', 'attachments') : ''"
        attachmentSandboxRoot: /srv/dsh/attachments
    - id: gxzs-sandbox-ssh
      name: '@deepseek-ai/dsh-sandbox-ssh'
    - id: gxzs-subprocess-ssh
      name: '@gxzs/dsh-workbench-sandbox-runtime/subprocess'
      config:
        ripgrepExecutable: !!js process.env.GXZS_SANDBOX_RG ?? '/usr/bin/rg'
    - id: gxzs-spill-sandbox
      name: '@gxzs/dsh-workbench-sandbox-runtime/spill'
      config:
        workspace: !!js process.env.GXZS_SANDBOX_WORKSPACE ?? '/workspace'
    - id: gxzs-workspace-changes
      name: '@gxzs/dsh-workbench-sandbox-runtime/changes'
    - id: gxzs-skill-filesystem
      name: '@gxzs/dsh-workbench-sandbox-skills/global'
    - id: gxzs-workbench-control-commands
      name: '@gxzs/dsh-workbench-control-commands'
    - id: gxzs-workbench-file-manager
      name: '@gxzs/dsh-workbench-file-manager'
      config:
        baseUrl: !!js process.env.GXZS_SANDBOX_MANAGER_URL
        workspaceId: !!js process.env.GXZS_SANDBOX_WORKSPACE_ID
        tokenEnv: GXZS_SANDBOX_MANAGER_TOKEN
        timeoutMs: 90000
    - id: gxzs-workbench-sandbox-skills
      name: '@gxzs/dsh-workbench-sandbox-skills'
    - id: gxzs-workbench-platform-client
      name: '@gxzs/dsh-workbench-platform-client'
      config:
        baseUrl: !!js process.env.GXZS_PLATFORM_INTERNAL_URL ?? ''
        tokenEnv: GXZS_PLATFORM_INTERNAL_TOKEN
        timeoutMs: 90000
    - id: gxzs-workbench-adapter
      name: '@gxzs/dsh-workbench-adapter'
      config:
        basePath: /ai/workbench
        databasePath: !!js (process.env.DSH_HOME ?? process.cwd()) + '/workbench.sqlite3'
        workspace: !!js process.env.GXZS_SANDBOX_WORKSPACE ?? '/workspace'
        ownerId: !!js process.env.GXZS_HOST_OWNER_ID
        assertionIssuer: !!js process.env.GXZS_ASSERTION_ISSUER
        assertionAudiencePath: !!js process.env.GXZS_ASSERTION_AUDIENCE_PATH ?? '/ai/workbench'
        assertionKeyEnv: GXZS_ASSERTION_SIGNING_KEY
        humanInputTimeoutSeconds: 60
    - id: gxzs-workbench-mcp-tools
      name: '@gxzs/dsh-workbench-mcp-tools'
      config:
        discovery: true
    - id: gxzs-tool-discovery
      name: '@gxzs/dsh-tool-discovery'
    - id: gxzs-native-schedule
      name: '@deepseek-ai/dsh-schedule'
