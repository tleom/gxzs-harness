name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Cache deployment profile package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-profile-${{ hashFiles('profiles/workbench/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-profile-
      - run: pnpm install --frozen-lockfile
      - name: Install deployment profile
        working-directory: profiles/workbench
        run: npm ci --no-audit --no-fund
      - name: Apply and verify the Host skill catalog patch
        run: |
          node scripts/patch-dsh-skill-catalog.mjs
          node scripts/check-dsh-skill-catalog.mjs
      - run: pnpm check
      - run: pnpm check:config

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Report production dependency advisories
        run: node scripts/audit-dependencies.mjs

  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/sandbox/mcp-requirements.lock.txt
      - run: python -m pip install -r services/sandbox/mcp-requirements.lock.txt pytest==8.3.5
      - name: Install pinned memory engine for the real-engine test
        run: |
          sudo mkdir -p /opt/gxzs-global-memory
          sudo chown "$(id -u):$(id -g)" /opt/gxzs-global-memory
          python services/sandbox-manager/global_memory.py --install
      - name: Manager and real Linux MCP transports
        env:
          GLOBAL_MEMORY_TEST_SOURCE: /opt/gxzs-global-memory/32ac237fb56afa43f73d668f1dfe9b306d71b025
        run: python -m pytest services/sandbox-manager/tests -q -rs

  images:
    # Avoid spending image-build minutes on a revision that fails a required check.
    needs: [verify, dependencies, manager]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build all first-party runtime images
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t gxzs/verify-host -f services/dsh-host/Dockerfile .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t gxzs/verify-manager services/sandbox-manager
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg WORKBENCH_FONT_IMAGE=system-fonts -t gxzs/verify-sandbox -f services/sandbox/Dockerfile .
      - name: Runtime, Office and container isolation smoke
        run: bash scripts/smoke-images.sh gxzs/verify-host gxzs/verify-manager gxzs/verify-sandbox
