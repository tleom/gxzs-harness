name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runner is UID 0 only inside a user namespace, with no chown capability.
  TAR_OPTIONS: --no-same-owner

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Fork code must never be scheduled on the persistent VPS runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'gxzs-harness-ci' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Frozen installs, Host patch and complete checks
        run: |
          source .github/scripts/runner-build-lock.sh
          pnpm install --frozen-lockfile
          npm ci --prefix profiles/workbench --no-audit --no-fund
          node scripts/patch-dsh-skill-catalog.mjs
          node scripts/check-dsh-skill-catalog.mjs
          pnpm check
          pnpm check:config

  dependencies:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'gxzs-harness-ci' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Report production dependency advisories
        run: |
          source .github/scripts/runner-build-lock.sh
          node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit
          retention-days: 7

  manager:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'gxzs-harness-ci' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Manager and real Linux MCP transports
        env:
          GLOBAL_MEMORY_TEST_SOURCE: /opt/gxzs-global-memory/32ac237fb56afa43f73d668f1dfe9b306d71b025
        run: |
          source .github/scripts/runner-build-lock.sh
          python -m venv "$RUNNER_TEMP/manager-venv"
          source "$RUNNER_TEMP/manager-venv/bin/activate"
          python -m pip install --no-cache-dir -r services/sandbox/mcp-requirements.lock.txt pytest==8.3.5
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted ]]; then
            sudo mkdir -p /opt/gxzs-global-memory
            sudo chown "$(id -u):$(id -g)" /opt/gxzs-global-memory
          fi
          python services/sandbox-manager/global_memory.py --install
          python -m pytest services/sandbox-manager/tests -q -rs --junitxml=artifacts/manager-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: manager-results
          path: artifacts/manager-junit.xml
          retention-days: 7

  images:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'gxzs-harness-ci' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build all images and run complete smoke
        run: |
          source .github/scripts/runner-build-lock.sh
          mkdir -p artifacts
          exec > >(tee artifacts/images.log) 2>&1
          docker info --format 'Security={{json .SecurityOptions}} CgroupDriver={{.CgroupDriver}}'
          df -h .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t gxzs/verify-host -f services/dsh-host/Dockerfile .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t gxzs/verify-manager services/sandbox-manager
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg WORKBENCH_FONT_IMAGE=system-fonts -t gxzs/verify-sandbox -f services/sandbox/Dockerfile .
          bash scripts/smoke-images.sh gxzs/verify-host gxzs/verify-manager gxzs/verify-sandbox
      - name: Bound disposable image and build cache storage
        if: always() && runner.environment == 'self-hosted'
        run: |
          source .github/scripts/runner-build-lock.sh
          # This path belongs only to the dedicated Harness CI daemon.
          test "$(docker info --format '{{.DockerRootDir}}')" = /srv/gxzs-harness-ci/docker
          docker image prune --force --filter label=org.opencontainers.image.source=https://github.com/tleom/gxzs-harness
          docker builder prune --force --keep-storage 1GB
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-smoke-log
          path: artifacts/images.log
          retention-days: 7
