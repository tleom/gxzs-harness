name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/verify.yml
      - .github/scripts/ci_scope.py
      - packages/**
      - patches/**
      - profiles/workbench/**
      - scripts/**
      - services/**
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Base commit for testing scoped checks; leave empty for full verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verification: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI change selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
        run: python3 .github/scripts/ci_scope.py

  verify:
    name: ${{ inputs.comparison_base != '' && 'verify comparison' || 'verify' }}
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a valid verification scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_SCOPE: ${{ needs.scope.outputs.verification }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$VERIFY_SCOPE" in
            full|docs|node-tests|identity-migration) ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Cache deployment profile package downloads
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-profile-${{ hashFiles('profiles/workbench/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-profile-
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
      - name: Install deployment profile
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        working-directory: profiles/workbench
        run: npm ci --no-audit --no-fund
      - name: Apply and verify the Host DSH patches
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        run: |
          node scripts/patch-dsh-skill-catalog.mjs
          node scripts/patch-dsh-mcp-tasks.mjs
          node scripts/check-dsh-skill-catalog.mjs
      - run: pnpm check
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
      - run: pnpm check:config
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
      - name: Report production dependency advisories
        if: needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'node-tests'
        run: node scripts/audit-dependencies.mjs

  manager:
    name: ${{ inputs.comparison_base != '' && 'manager comparison' || 'manager' }}
    needs: scope
    if: github.event_name != 'push' && (needs.scope.outputs.verification == 'full' || needs.scope.outputs.verification == 'identity-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/sandbox/mcp-requirements.lock.txt
      - name: Verify identity migration
        if: needs.scope.outputs.verification == 'identity-migration'
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest services/sandbox-manager/tests/test_migrate_host_identity.py -q -rs
      - run: python -m pip install -r services/sandbox/mcp-requirements.lock.txt pytest==8.3.5
        if: needs.scope.outputs.verification == 'full'
      - name: Install pinned memory engine for the real-engine test
        if: needs.scope.outputs.verification == 'full'
        run: |
          sudo mkdir -p /opt/gxzs-global-memory
          sudo chown "$(id -u):$(id -g)" /opt/gxzs-global-memory
          python services/sandbox-manager/global_memory.py --install
      - name: Manager and real Linux MCP transports
        if: needs.scope.outputs.verification == 'full'
        env:
          GLOBAL_MEMORY_TEST_SOURCE: /opt/gxzs-global-memory/32ac237fb56afa43f73d668f1dfe9b306d71b025
        run: python -m pytest services/sandbox-manager/tests -q -rs

  images:
    name: ${{ inputs.comparison_base != '' && 'images comparison' || 'images' }}
    # Avoid spending image-build minutes on a revision that fails a required check.
    needs: [scope, verify, manager]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.verification == 'full' && (github.event_name == 'push' || (needs.verify.result == 'success' && needs.manager.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room for runtime image layers
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          df -h /
          # BuildKit and the loaded smoke-test images coexist. These bundled
          # SDKs are unused by the Node/Python/container verification below.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Host image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/dsh-host/Dockerfile
          load: ${{ github.event_name != 'push' }}
          push: false
          tags: gxzs/verify-host
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=harness-host
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=harness-host,mode=max' || '' }}
      - name: Build Manager image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/sandbox-manager
          load: ${{ github.event_name != 'push' }}
          push: false
          tags: gxzs/verify-manager
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=harness-manager
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=harness-manager,mode=max' || '' }}
      - name: Build Sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/sandbox/Dockerfile
          load: ${{ github.event_name != 'push' }}
          push: false
          tags: gxzs/verify-sandbox
          build-args: |
            VCS_REF=${{ github.sha }}
            WORKBENCH_FONT_IMAGE=system-fonts
          cache-from: type=gha,scope=harness-sandbox
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=harness-sandbox,mode=max' || '' }}
      - name: Runtime, Office and container isolation smoke
        if: github.event_name != 'push'
        run: bash scripts/smoke-images.sh gxzs/verify-host gxzs/verify-manager gxzs/verify-sandbox
      - name: Record image storage usage
        if: always()
        run: |
          df -h /
          docker system df
